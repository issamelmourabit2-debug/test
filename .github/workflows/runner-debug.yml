name: Temporary runner debugging - 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show public IP
        run: |
          echo "=== PUBLIC IP ==="
          curl -4fsS --max-time 20 https://api.ipify.org
          echo

      - name: Install Tailscale
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 \
            https://tailscale.com/install.sh \
            -o /tmp/install-tailscale.sh
          sudo sh /tmp/install-tailscale.sh

      - name: Connect runner to Tailscale
        timeout-minutes: 5
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY" || {
            echo "::error::Missing TAILSCALE_AUTHKEY repository secret"
            exit 1
          }

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --ssh \
            --accept-dns=false \
            --hostname="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --timeout=4m

      - name: Show SSH connection and keep session open
        timeout-minutes: 225
        run: |
          set -euo pipefail
          RUNNER_IP="$(tailscale ip -4)"
          echo "Connect from a device on your tailnet:"
          echo "ssh runner@${RUNNER_IP}"
          echo "Session available for 220 minutes."
          sleep 13200

      - name: Disconnect Tailscale
        if: always()
        timeout-minutes: 2
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            sudo tailscale logout
          fi
