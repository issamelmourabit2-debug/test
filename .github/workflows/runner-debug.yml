name: Temporary runner debugging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Open temporary SSH session
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 55
        with:
          limit-access-to-actor: true
