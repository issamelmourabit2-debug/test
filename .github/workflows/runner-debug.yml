name: Temporary runner debugging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Diagnose DNS
        shell: bash
        run: |
          for host in github.com tmate.io ssh.tmate.io; do
            echo "Checking: $host"
            if timeout 10 getent ahostsv4 "$host"; then
              echo "DNS OK"
            else
              echo "DNS FAILED"
            fi
          done

          echo "Public DNS check:"
          curl --max-time 20 --fail --silent --show-error \
            'https://dns.google/resolve?name=ssh.tmate.io&type=A'
