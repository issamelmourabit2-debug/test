name: Temporary runner debugging - 3

on:
  workflow_dispatch:

permissions:
  contents: read

# Only one workflow may use this hostname at a time.
concurrency:
  group: tailscale-work-3
  cancel-in-progress: false

env:
  TS_HOSTNAME: work-3

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tailscale
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 \
            https://tailscale.com/install.sh \
            -o /tmp/install-tailscale.sh
          sudo sh /tmp/install-tailscale.sh

      - name: Connect with fixed hostname
        timeout-minutes: 5
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "$TAILSCALE_AUTHKEY" || {
            echo "::error::Missing TAILSCALE_AUTHKEY secret"
            exit 1
          }

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --ssh \
            --accept-dns=false \
            --hostname="$TS_HOSTNAME" \
            --timeout=4m

          # Fail clearly if an old device is holding the requested name.
          ACTUAL_DNS="$(tailscale status --json |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["Self"]["DNSName"].rstrip("."))')"

          EXPECTED_DNS="${TS_HOSTNAME}.tail5244e2.ts.net"

          if [ "$ACTUAL_DNS" != "$EXPECTED_DNS" ]; then
            echo "::error::Expected $EXPECTED_DNS but received $ACTUAL_DNS"
            echo "Check Tailscale Machines for an old device using this name."
            exit 1
          fi

      - name: Show SSH command and keep session available
        timeout-minutes: 225
        run: |
          echo "Connect from your Tailscale-connected PC:"
          echo "ssh runner@${TS_HOSTNAME}.tail5244e2.ts.net"
          echo "Session available for 220 minutes."
          sleep 13200

      - name: Disconnect and clean up
        if: always()
        timeout-minutes: 2
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            sudo tailscale logout
          fi
